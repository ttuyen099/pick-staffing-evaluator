                            const filtered=assocs.filter(a=>(a.paid_hours||0)>=0.05);
                            const aw=data.active_workforce||{};
                            const activeLogins=aw[p.name]||[];
                            const hasWF=activeLogins.length>0;
                            const active=hasWF?filtered.filter(a=>{const l=a.login||'';return l&&activeLogins.includes(l);}):filtered;
                            const inactive=hasWF?filtered.filter(a=>{const l=a.login||'';return !l||!activeLogins.includes(l);}):[];
                            let rows='';
                            if(hasWF&&active.length>0) rows+=`<tr><td colspan="7" style="padding:10px 8px 6px;font-size:0.7rem;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--hairline);background:var(--bg-1);">CURRENTLY PICKING (${active.length})</td></tr>`;
                            rows+=active.map(a=>renderRow(a,p,false)).join('');
                            if(hasWF&&inactive.length>0) rows+=`<tr><td colspan="7" style="padding:14px 8px 6px;font-size:0.7rem;font-weight:700;color:var(--label-3);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--hairline);background:var(--bg-1);">PRIOR / INACTIVE (${inactive.length})</td></tr>`;
                            rows+=inactive.map(a=>renderRow(a,p,true)).join('');
                            return rows;
                        })()}</tbody>
                    </table>
                </div>
            </div>`;
        }
        } // end else (not xtrain)
        document.getElementById('pathGrid').innerHTML=html;
        document.getElementById('pathGrid').style.gridTemplateColumns = (selectedPath && selectedPath!=='xtrain') ? '1fr' : 'repeat(auto-fill, minmax(320px, 1fr))';

        // Two-column overview only when no specific view is selected
        const cols = document.getElementById('overviewCols');
        if (cols) cols.classList.toggle('single', !!selectedPath);

        renderMoveLog();

        // Keep the Idle chip/panel live: if a scan is in progress (or the Idle
        // tab is open), ensure the 5s poller is running. It self-stops when the
        // scan finishes and the Idle tab isn't open.
        if ((data.idle && data.idle.scanning) || selectedPath === 'idle') {
            startIdlePoll();
        }
    }

    // ============================================================
    // Path Move Log (Overview tab)
    // Shows each picker moved from process path A -> B, and when.
    // Data comes from the server's /api/move-log endpoint, which reads
    // the auto-detected moves the backend logs each refresh.
    // ============================================================
    async function fetchMoveLog() {
        try {
            const r = await fetch(API + '/api/move-log?' + moveLogQuery());
            if (r.ok) {
                const res = await r.json();
                if (res.success) { moveLog = res.moves || []; }
            }
        } catch(e) { /* leave moveLog as-is */ }
    }

    // Build the query string for the move-log endpoint from the selected range.
    function moveLogQuery() {
        const p = new URLSearchParams();
        p.set('limit', '500');
        if (moveLogRange === 'shift') {
            // Prefer the top-bar Start/End inputs; if they're not populated yet,
            // compute the current shift window directly so we never fall back to
            // "all time" and show months-old data.
            let s = (document.getElementById('startTime') || {}).value || '';
            let e = (document.getElementById('endTime') || {}).value || '';
            if (!s || !e) {
                try {
                    const w = getShiftWindow();
                    s = fmt(w.start); e = fmt(w.end);
                } catch(_) {}
            }
            if (s) p.set('start', s);
            if (e) p.set('end', e);
        } else if (moveLogRange === '4h') {
            p.set('hours', '4');
        } else if (moveLogRange === '12h') {
            p.set('hours', '12');
        } // 'all' -> no time filter
        return p.toString();
    }

    async function changeMoveLogRange(sel) {
        moveLogRange = sel.value;
        moveLogScroll = 0;
        await fetchMoveLog();
        renderMoveLogTable();
    }

    function moveLogFilterInput(el) {
        moveLogFilter = (el.value || '').trim().toLowerCase();
        renderMoveLogTable();
    }

    function renderMoveLog() {
        const section = document.getElementById('moveLogSection');
        if (!section) return;
        // Only show on the Overview tab
        if (selectedPath) { section.style.display = 'none'; return; }
        section.style.display = '';

        // Build the outer shell only once so the search box and scroll
        // container persist across refreshes (scroll position is not reset).
        if (!document.getElementById('moveLogTableWrap')) {
            section.innerHTML = `
                <div class="panel" style="padding:0;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 160px);">
                    <div style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--hairline);flex:0 0 auto;">
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">
                            <h3 style="font-size:var(--fs-subhead);">Path Move Log</h3>
                            <div style="display:flex;align-items:center;gap:6px;">
                                <select id="moveLogRangeSel" onchange="changeMoveLogRange(this)" title="Time range" class="field" style="padding:5px 8px;min-height:30px;font-size:var(--fs-caption1);">
                                    <option value="shift">This shift</option>
                                    <option value="4h">Last 4h</option>
                                    <option value="12h">Last 12h</option>
                                    <option value="all">All</option>
                                </select>
                                <button class="btn secondary" onclick="refreshMoveLog()" style="padding:5px 10px;">Refresh</button>
                                <button class="btn" onclick="exportMoveLog()" style="padding:5px 10px;" title="Export end-of-shift CSV">Export CSV</button>
                            </div>
                        </div>
                        <input type="text" id="moveLogSearch" placeholder="Filter by login or path..." value="${moveLogFilter}" oninput="moveLogFilterInput(this)" style="width:100%;background:var(--bg-1);border:1px solid var(--hairline);color:var(--label-1);padding:6px 10px;border-radius:6px;font-size:0.75rem;">
                    </div>
                    <div id="moveLogTableWrap" onscroll="moveLogScroll=this.scrollTop" style="overflow-y:auto;flex:1 1 auto;padding:0 4px 4px;"></div>
                </div>`;
            const rsel = document.getElementById('moveLogRangeSel');
            if (rsel) rsel.value = moveLogRange;
        }
        renderMoveLogTable();
    }

    function renderMoveLogTable() {
        const wrap = document.getElementById('moveLogTableWrap');
        if (!wrap) return;

        const q = moveLogFilter;
        const rows = (moveLog || []).filter(m => {
            if (!q) return true;
            return (m.login || '').toLowerCase().includes(q)
                || (m.name || '').toLowerCase().includes(q)
                || (m.from_path || '').toLowerCase().includes(q)
                || (m.to_path || '').toLowerCase().includes(q);
        });

        let body;
        if (rows.length === 0) {
            body = `<tr><td colspan="3" style="color:var(--label-3);text-align:center;padding:20px;font-size:0.75rem;">${(moveLog||[]).length===0 ? 'No path moves detected yet. Moves are logged automatically as pickers change paths.' : 'No moves match your filter.'}</td></tr>`;
        } else {
            body = rows.map(m => {
                const t = (m.timestamp || '').replace('T', ' ').slice(5, 16); // MM-DD HH:MM
                const dot = m.source === 'auto'
                    ? '<span title="Auto-detected" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:middle;"></span>'
                    : '<span title="Manual" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--yellow);margin-right:5px;vertical-align:middle;"></span>';
                const who = m.login || m.employee_id || '--';
                const nameTitle = (m.name || '').replace(/"/g, '&quot;');
                return `<tr title="${nameTitle}">
                    <td style="color:var(--label-2);">${dot}${who}</td>
                    <td><span style="color:var(--red);">${m.from_path || '--'}</span> <span style="color:var(--label-3);">→</span> <span style="color:var(--green);">${m.to_path || '--'}</span></td>
                    <td style="color:var(--label-2);font-variant-numeric:tabular-nums;">${t || '--'}</td>
                </tr>`;
            }).join('');
        }

        wrap.innerHTML = `
            <table class="movelog-table">
                <colgroup><col style="width:26%"><col style="width:54%"><col style="width:20%"></colgroup>
                <thead><tr>
                    <th>Login</th><th>From → To</th><th>Time</th>
                </tr></thead>
                <tbody>${body}</tbody>
            </table>`;
        // Restore the saved scroll position so a refresh doesn't jump to top
        wrap.scrollTop = moveLogScroll;
    }

    async function refreshMoveLog() {
        await fetchMoveLog();
        renderMoveLogTable();
    }

    // Download the end-of-shift CSV for the current time-range selection.
    // Exports all pickers in the window (an EOS report wants everyone); the
    // on-screen text filter is a view convenience and is intentionally not
    // applied here so a path-fragment filter can't produce an empty report.
    function exportMoveLog() {
        const p = new URLSearchParams(moveLogQuery());
        p.delete('limit');
        const url = API + '/api/move-log/export?' + p.toString();
        const a = document.createElement('a');
        a.href = url;
        a.download = '';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function togglePath(ev, name) {
        if(ev.target.closest('.path-expand')) return; // don't toggle when clicking inside table
        if(openPaths.has(name)) openPaths.delete(name); else openPaths.add(name);
        const el=document.getElementById('expand-'+name.replace(/\s+/g,'-'));
        if(el) el.classList.toggle('open');
    }

    function selectPath(name) {
        selectedPath = name;
        render();
        // Manage the idle poller. On the Idle tab, always poll (live panel).
        // On other tabs, keep polling only while a scan is still running so the
        // summary chip updates live; otherwise stop.
        if (name === 'idle') {
            startIdlePoll();
        } else if (!(data && data.idle && data.idle.scanning)) {
            stopIdlePoll();
        }
    }

    // ============================================================
    // Idle panel — reusable builder + lightweight live poller.
    // While the Idle tab is open AND a scan is running, we poll the small
    // /api/idle endpoint every 5s and refresh ONLY the #idlePanel contents,
    // so results tick in live without a full /api/data round-trip.
    // ============================================================
    // Tracks which associate rows are expanded (by employee_id/login) so the
    // breakdown stays open across the 5s panel re-renders.
    const _idleExpanded = new Set();
    function toggleIdleRow(key) {
        if (_idleExpanded.has(key)) _idleExpanded.delete(key);
        else _idleExpanded.add(key);
        // Re-render just the idle panel in place.
        const panel = document.getElementById('idlePanel');
        if (panel && data && data.idle) panel.innerHTML = buildIdlePanel(data.idle);
    }

    // Status-column sort for the "By Associate" idle table.
    //   null       -> server order (default)
    //   'need'     -> Need STU first, then Good
    //   'good'     -> Good first, then Need STU
    // Double-clicking the Status header cycles need -> good -> need.
    let _idleStatusSort = null;
    function sortIdleByStatus() {
        _idleStatusSort = (_idleStatusSort === 'need') ? 'good' : 'need';
        const panel = document.getElementById('idlePanel');
        if (panel && data && data.idle) panel.innerHTML = buildIdlePanel(data.idle);
    }

    function buildIdlePanel(idleData) {
        const idle = idleData || {threshold_min:30, flagged:[], all:[], by_path:[], last_scan:null, scanning:false};
        const thr = idle.threshold_min || 30;
        const flagged = (idle.flagged || []);
        const all = (idle.all || []);
        // Optional client-side sort by Status (double-click the Status header).
        // Stable sort preserves the server's longest-gap ordering within each
        // status group. flagged === true means "Need STU", false means "Good".
        const sortedAll = (() => {
            if (!_idleStatusSort) return all;
            const rank = r => {
                const need = !!r.flagged;  // true = Need STU
                return (_idleStatusSort === 'need') ? (need ? 0 : 1) : (need ? 1 : 0);
            };
            return all
                .map((r, i) => [r, i])                       // decorate with index
                .sort((a, b) => (rank(a[0]) - rank(b[0])) || (a[1] - b[1]))
                .map(pair => pair[0]);                       // stable within group
        })();
        const fmt = m => { const x=Math.round(m||0); const h=Math.floor(x/60), mm=x%60; return h>0?(h+'h '+mm+'m'):(mm+'m'); };
        const scanLbl = idle.scanning
            ? ('<span style="color:var(--yellow);">&#9696; scanning' + ((idle.scan_total)?(' '+(idle.scan_done||0)+'/'+idle.scan_total):'') + '...</span>')
            : (idle.last_scan ? '<span style="color:var(--green);">&#10003; scanned '+idle.last_scan+'</span>' : '<span style="color:var(--label-2);">not scanned yet</span>');
        const assocRows = all.length>0
            ? sortedAll.map(r=>{
                const f=!!r.flagged;
                const key = (r.employee_id || r.login || '').toString();
                const open = _idleExpanded.has(key);
                const fclm = r.fclm_url
                    ? `<a href="${r.fclm_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-weight:600;" title="Open FCLM Time Details for ${r.login||r.employee_id||''}">FCLM &#8599;</a>`
                    : '<span style="color:var(--label-4);">—</span>';
                // Shares of TOTAL SHIFT time: green=productive, red=idle, the
                // dark remainder = indirect/other (meetings/training/etc).
                const ip = (typeof r.idle_pct==='number')?r.idle_pct:0;
                const pp = (typeof r.prod_pct==='number')?r.prod_pct:0;
                const pctBar = `<div class="idle-bar">
                    <div class="track">
                        <div class="seg-prod" style="width:${pp}%;"></div>
                        <div class="seg-idle" style="width:${ip}%;"></div>
                    </div>
                    <span class="pct" style="color:${ip>=50?'var(--red)':'var(--label-2)'};">${ip.toFixed(0)}%</span>
                </div>`;
                const caret = (r.gaps && r.gaps.length)
                    ? `<span class="caret ${open?'open':''}">&#9654;</span>`
                    : '<span class="caret" style="visibility:hidden;">&#9654;</span>';
                const mainRow = `<tr onclick="toggleIdleRow('${key}')" style="cursor:${(r.gaps&&r.gaps.length)?'pointer':'default'};">
                    <td>${caret} ${r.login||'—'}</td>
                    <td style="color:${f?'var(--red)':'var(--label-2)'};font-weight:${f?'600':'400'};">${fmt(r.idle_min)}</td>
                    <td class="muted">${fmt(r.shift_min)}</td>
                    <td style="min-width:160px;">${pctBar}</td>
                    <td>${f?'<span class="rate-pill below">&#9888; Need STU</span>':'<span class="rate-pill above">Good</span>'}</td>
                    <td>${fclm}</td>
                </tr>`;
                // Expanded detail: this AA's idle gaps, highest -> lowest.
                let detail = '';
                if (open && r.gaps && r.gaps.length) {
                    const gapRows = r.gaps.map((g,i)=>`<tr>
                        <td style="color:var(--label-3);padding-left:28px;">#${i+1}</td>
                        <td style="color:${g.minutes>=thr?'var(--red)':'var(--label-2)'};font-weight:${g.minutes>=thr?'700':'400'};">${fmt(g.minutes)}</td>
                        <td style="color:var(--label-2);">${g.start} &ndash; ${g.end}</td>
                        <td style="color:var(--label-2);">${g.path||'—'}</td>
                    </tr>`).join('');
                    detail = `<tr><td colspan="6" style="padding:0 0 var(--sp-2) 0;background:rgba(255,255,255,0.025);">
                        <table class="assoc-table idle-table gaps" style="margin:0;background:transparent;font-size:var(--fs-footnote);">
                            <thead><tr>
                                <th style="padding-left:28px;">Gap</th><th>Duration</th><th>Window</th><th>Path</th>
                            </tr></thead>
                            <tbody>${gapRows}</tbody>
                        </table>
                    </td></tr>`;
                }
                return mainRow + detail;
              }).join('')
            : `<tr><td colspan="6" style="color:var(--label-3);text-align:center;padding:20px;">${idle.scanning?('Scanning idle time… '+((idle.scan_total)?((idle.scan_done||0)+'/'+idle.scan_total):'')):'No idle data yet — it populates a few seconds after each FCLM pull.'}</td></tr>`;
        // Shift-wide roll-up: total idle vs total direct across all scanned AAs.
        const totDirect = all.reduce((s,r)=>s+(r.direct_min||0),0);
        const totIdle = all.reduce((s,r)=>s+(r.total_idle_min||0),0);
        const totActive = totDirect + totIdle;
        const fleetIdlePct = totActive>0 ? (totIdle/totActive*100) : 0;
        const rollup = all.length>0
            ? `<div class="row mb-4" style="gap:var(--sp-4);font-size:var(--fs-footnote);">
                 <span class="muted">Shift totals</span>
                 <span style="color:var(--green);">Productive ${fmt(totDirect)}</span>
                 <span style="color:var(--red);">Idle ${fmt(totIdle)}</span>
                 <span style="color:${fleetIdlePct>=25?'var(--red)':'var(--label-2)'};font-weight:600;">${fleetIdlePct.toFixed(1)}% idle</span>
               </div>`
            : '';
        return `<div class="panel">
            <div class="panel-head">
                <h3>Idle Time</h3>
                <span class="rate-pill below">${flagged.length} flagged &ge; ${thr} min</span>
                <span style="font-size:var(--fs-caption1);">${scanLbl}</span>
            </div>
            <div class="panel-note">
                Flags the single longest <b>continuous</b> idle gap — paid on-clock time not covered by a direct pick path.
                Training / meetings / indirect time is excluded (it is neither idle nor does it bridge a gap).
            </div>
            <div class="section-title">By Associate</div>
            ${rollup}
            <table class="assoc-table idle-table by-assoc">
                <thead><tr><th>Login</th><th>Longest Gap</th><th>Total Shift</th><th>Idle % of Shift</th><th class="th-sortable ${_idleStatusSort?'is-sorted':''}" ondblclick="sortIdleByStatus()" title="Double-click to group by status (Need STU / Good)"><span class="th-label">Status</span><span class="th-sort" aria-hidden="true">${_idleStatusSort?(_idleStatusSort==='need'?'&#9650;':'&#9660;'):'&#8645;'}</span></th><th>Verify</th></tr></thead>
                <tbody>${assocRows}</tbody>
            </table>
        </div>`;
    }

    let _idlePollTimer = null;
    async function pollIdleOnce() {
        try {
            const r = await fetch(API + '/api/idle');
            if (!r.ok) return;
            const idle = await r.json();
            // Keep the shared data object in sync so a full render() stays correct,
            // and update the tab badge / summary chip counts.
            if (data) data.idle = idle;
            const flaggedCount = (idle.flagged || []).length;
            // Live-refresh the Idle panel if the tab is open.
            const panel = document.getElementById('idlePanel');
            if (panel && selectedPath === 'idle') {
                panel.innerHTML = buildIdlePanel(idle);
            }
            // Live-refresh the Idle tab badge count (if the tab bar is rendered),
            // and keep its alert/ok state dot in step with the count.
            const tabBadge = document.getElementById('idleTabCount');
            if (tabBadge) {
                tabBadge.textContent = flaggedCount + ' flagged';
                const tab = tabBadge.closest('.path-tab');
                if (tab) { tab.classList.toggle('alert', flaggedCount > 0); tab.classList.toggle('ok', flaggedCount === 0); }
            }
            // Live-refresh the Overview summary chip count (visible on any tab).
            const chip = document.getElementById('idleChipCount');
            if (chip) chip.textContent = flaggedCount;
            // Lifecycle: keep polling while a scan is running OR while the Idle
            // tab is open (so the panel ticks live). Otherwise stop — the 30s
            // /api/data cycle keeps the chip fresh at rest.
            if (!idle.scanning && selectedPath !== 'idle') stopIdlePoll();
        } catch(e) { /* transient; keep polling */ }
    }
    function startIdlePoll() {
        if (_idlePollTimer) return;  // already running
        // Kick an immediate refresh, then every 5s.
        pollIdleOnce();
        _idlePollTimer = setInterval(pollIdleOnce, 5000);
    }
    function stopIdlePoll() {
        if (_idlePollTimer) { clearInterval(_idlePollTimer); _idlePollTimer = null; }
    }

    // Attrition tracking (stored in localStorage per site + shift date)
    let _attritionSite = '';
    function getAttritionKey(){ return 'pickmatrix_attrition_'+(_attritionSite?_attritionSite+'_':'')+new Date().toISOString().slice(0,10); }
    function getAttrition(){ return JSON.parse(localStorage.getItem(getAttritionKey())||'[]'); }
    function addAttrition(){
        const input=document.getElementById('attritionInput');
        const timeInput=document.getElementById('attritionTime');
        const login=(input?input.value:'').trim();
        if(!login) return;
        const departing=timeInput?timeInput.value:'';
        const list=getAttrition();
        if(list.find(a=>a.login===login)) return;
        list.push({login:login, departing:departing||'?', time:new Date().toLocaleTimeString()});
        localStorage.setItem(getAttritionKey(),JSON.stringify(list));
        if(input) input.value='';
        render();
    }
    function removeAttrition(idx){
        const list=getAttrition();
        list.splice(idx,1);
        localStorage.setItem(getAttritionKey(),JSON.stringify(list));
        render();
    }

    function showAttrSuggestions(){
        const input=document.getElementById('attritionInput');
        const box=document.getElementById('attrSuggestions');
        if(!input||!box) return;
        const q=input.value.toLowerCase().trim();
        if(q.length<2){box.style.display='none';return;}
        // Get all logins from active workforce and associates
        const allLogins=new Set();
        const abp=data.associates_by_path||{};
        for(const assocs of Object.values(abp)){
            for(const a of assocs){ if(a.login) allLogins.add(a.login); }
        }
        const aw=data.active_workforce||{};
        for(const logins of Object.values(aw)){ for(const l of logins) allLogins.add(l); }
        // Filter matches
        const matches=[...allLogins].filter(l=>l.toLowerCase().includes(q)).slice(0,8);
        if(matches.length===0){box.style.display='none';return;}
        box.style.display='block';
        box.innerHTML=matches.map(m=>`<div onclick="selectAttrSuggestion('${m}')" style="padding:6px 12px;cursor:pointer;font-size:0.78rem;color:var(--label-1);border-bottom:1px solid var(--hairline);" onmouseover="this.style.background='var(--fill-3)'" onmouseout="this.style.background=''">${m}</div>`).join('');
    }

    function selectAttrSuggestion(login){
        document.getElementById('attritionInput').value=login;
        document.getElementById('attrSuggestions').style.display='none';
    }

    function filterXtrain() {
        const q = (document.getElementById('xtrainSearch')||{}).value||'';
        const term = q.toLowerCase();
        const rows = document.querySelectorAll('.xtrain-row');
        rows.forEach(r => { r.style.display = r.dataset.search.includes(term) ? '' : 'none'; });
    }

    function renderRow(a, p, isInactive) {
        const tol=data.tolerance||0.05;
        const ctMap=data.cross_training_by_employee_id||{};
        const pfc=pf(a.rate||0,p.expected,tol);
        const ct=ctMap[a.employee_id]||[];
        const dots=ct.map(d=>`<span class="ct-d ${DC[d]||''}" title="${d}"></span>`).join('');
        // Resolve login: prefer the associate's own login, then the live
        // eid_to_login map (FCLM roster + console bridge), then employee_id.
        const eidMap=data.eid_to_login||{};
        const login=a.login||eidMap[a.employee_id]||a.employee_id||'';
        const histInfo=data.history_summary&&data.history_summary[a.employee_id]?data.history_summary[a.employee_id]:null;
        const histDays=histInfo?histInfo.days_active:0;
        // Tooltip
        let tipContent='';
        if(histInfo&&histInfo.path_rates&&Object.keys(histInfo.path_rates).length>0){
            const pathRates=histInfo.path_rates;
            const allExp=data.rate_expectations||{};
            const defE=data.default_rate_expectation||5;
            let goodPaths=[],badPaths=[],currentPathRate=null;
            for(const [pw,stats] of Object.entries(pathRates)){
                if(pw===p.name){currentPathRate=stats;continue;}
                const goal=getGoal(pw,allExp[pw]||defE);
                if(stats.avg_rate>=goal) goodPaths.push({path:pw,rate:stats.avg_rate,goal,shifts:stats.shifts});
                else badPaths.push({path:pw,rate:stats.avg_rate,goal,shifts:stats.shifts});
            }
            if(currentPathRate) tipContent+=`<div style="color:var(--label-2);margin-bottom:4px;">Current: ${p.name} ${currentPathRate.avg_rate} UPH (${currentPathRate.shifts} shifts)</div>`;
            if(goodPaths.length>0){tipContent+=`<div class="tip-title">STRENGTHS:</div>`;for(const g of goodPaths)tipContent+=`<div class="tip-yes">&#10003; ${g.path}: ${g.rate} avg (${g.shifts}d)</div>`;}
            if(badPaths.length>0){tipContent+=`<div class="tip-title" style="margin-top:4px;">OPPORTUNITIES:</div>`;for(const b of badPaths)tipContent+=`<div class="tip-no">&#10007; ${b.path}: ${b.rate} avg (${b.shifts}d)</div>`;}
            if(!goodPaths.length&&!badPaths.length&&!currentPathRate) tipContent+=`<div style="color:var(--label-3);">Collecting data...</div>`;
        } else { tipContent=`<div style="color:var(--label-3);">Collecting data...</div>`; }
        const rowClass=isInactive?`${pfc} inactive`:pfc;
        return `<tr class="${rowClass}"><td class="has-tip">${a.name||''}<div class="tip-box">${tipContent}</div></td><td class="has-tip">${login}<div class="tip-box">${tipContent}</div></td><td><span class="rate-pill ${pfc}">${(a.rate||0).toFixed(1)}</span></td><td>${a.units||0}</td><td>${(a.paid_hours||0).toFixed(1)}</td><td><span class="ct-dots">${dots||'--'}</span></td><td><button onclick="event.stopPropagation();showRecommend('${a.employee_id}','${p.name}','${a.name||login}')" class="mini-btn">${histDays?histDays+'d':'?'}</button></td></tr>`;
    }

    // Cross-training
    // Recommend Move
    async function showRecommend(employeeId, fromPath, name) {
        const modal = document.getElementById('recModal');
        modal.style.display = 'flex';
        document.getElementById('recTitle').textContent = `Move Recommendation: ${name}`;
        document.getElementById('recContent').innerHTML = '<div class="spinner" style="margin:20px auto;"></div>';
        
        // First get their history
        try {
            const hRes = await fetch(`${API}/api/history?employee_id=${employeeId}`);
            const hData = await hRes.json();
            
            let html = '';
            
            // Show path averages
            const avgs = hData.path_averages || {};
            if (Object.keys(avgs).length > 0) {
                html += `<div style="margin-bottom:14px;"><strong style="color:var(--label-1);">14-Day History (${Object.keys(avgs).length} paths worked):</strong></div>`;
                html += '<table style="width:100%;border-collapse:collapse;font-size:0.75rem;margin-bottom:14px;">';
                html += '<tr style="border-bottom:1px solid var(--label-4);"><th style="text-align:left;padding:6px 8px;color:var(--label-2);">Path</th><th style="text-align:right;padding:6px 8px;color:var(--label-2);">Avg Rate</th><th style="text-align:right;padding:6px 8px;color:var(--label-2);">Shifts</th><th style="text-align:right;padding:6px 8px;color:var(--label-2);">Range</th></tr>';
                for (const [path, stats] of Object.entries(avgs)) {
                    html += `<tr style="border-bottom:1px solid var(--hairline);"><td style="padding:6px 8px;color:var(--label-1);">${path}</td><td style="text-align:right;padding:6px 8px;font-weight:600;color:var(--green);">${stats.avg_rate}</td><td style="text-align:right;padding:6px 8px;color:var(--label-1);">${stats.total_shifts}</td><td style="text-align:right;padding:6px 8px;color:var(--label-2);">${stats.min_rate} - ${stats.max_rate}</td></tr>`;
                }
                html += '</table>';
            } else {
                html += '<p style="color:var(--label-2);margin-bottom:14px;">No historical data yet. Data collects automatically each shift.</p>';
            }
            
            // Show move recommendation form
            const paths = Object.keys(data.paths || {}).filter(p => p !== fromPath);
            html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--hairline);">`;
            html += `<strong style="color:var(--label-1);">Simulate Move from ${fromPath}:</strong>`;
            html += `<div style="display:flex;gap:8px;margin-top:8px;align-items:center;">`;
            html += `<select id="recDestPath" style="background:var(--bg-1);border:1px solid var(--hairline);color:var(--label-1);padding:4px 8px;border-radius:4px;font-size:0.75rem;">`;
            for (const p of paths) {
                html += `<option value="${p}">${p}</option>`;
            }
            html += `</select>`;
            html += `<span style="color:var(--label-3);font-size:0.7rem;">Goal:</span>`;
            html += `<input type="number" id="recGoal" value="${getGoal(paths[0],5)}" style="width:50px;background:var(--bg-1);border:1px solid var(--hairline);color:var(--label-1);padding:3px 6px;border-radius:3px;font-size:0.75rem;text-align:center;">`;
            html += `<button onclick="runRecommend('${employeeId}','${fromPath}')" style="background:var(--blue);color:var(--label-1);border:none;padding:4px 12px;border-radius:4px;font-size:0.75rem;cursor:pointer;">Analyze</button>`;
            html += `</div>`;
            html += `<div id="recResult" style="margin-top:10px;"></div>`;
            html += `</div>`;
            
            document.getElementById('recContent').innerHTML = html;
            
            // Update goal when dest path changes
            const destSelect = document.getElementById('recDestPath');
            if (destSelect) {
                destSelect.onchange = () => {
                    document.getElementById('recGoal').value = getGoal(destSelect.value, 5);
                };
            }
        } catch(e) {
            document.getElementById('recContent').innerHTML = '<p style="color:var(--red);">Error loading history.</p>';
        }
    }
    
    async function runRecommend(employeeId, fromPath) {
        const toPath = document.getElementById('recDestPath').value;
        const goal = parseFloat(document.getElementById('recGoal').value) || 5;
        document.getElementById('recResult').innerHTML = '<div class="spinner" style="margin:10px auto;width:20px;height:20px;"></div>';
        
        try {
            const r = await fetch(`${API}/api/recommend-move`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({employee_id: employeeId, from_path: fromPath, to_path: toPath, goal_uph: goal})
            });
            const res = await r.json();
            const rec = res.recommendation;
            
            let color = rec.verdict === 'GOOD MOVE' ? 'var(--green)' : rec.verdict === 'OKAY MOVE' ? 'var(--yellow)' : rec.verdict === 'RISKY MOVE' ? 'var(--red)' : 'var(--label-2)';
            let html = `<div style="margin-top:8px;padding:10px;background:var(--bg-1);border-radius:6px;border:1px solid var(--hairline);">`;
            html += `<div style="font-size:1rem;font-weight:700;color:${color};margin-bottom:6px;">${rec.verdict}</div>`;
            html += `<div style="font-size:0.7rem;color:var(--label-3);margin-bottom:6px;">Confidence: ${rec.confidence}</div>`;
            for (const reason of rec.reasoning || []) {
                html += `<div style="font-size:0.75rem;color:var(--label-1);margin-bottom:3px;">• ${reason}</div>`;
            }
            if (rec.dest_avg_rate) html += `<div style="margin-top:6px;font-size:0.75rem;color:var(--label-2);">Dest avg: ${rec.dest_avg_rate} UPH over ${rec.dest_shifts_worked} shifts</div>`;
            if (rec.path_pair_insight) html += `<div style="margin-top:4px;font-size:0.7rem;color:var(--label-3);">Path pair: ${rec.path_pair_insight.success_rate}% success rate (${rec.path_pair_insight.total_moves} moves tracked)</div>`;
            if (rec.learning_stats && rec.learning_stats.total_moves_logged > 0) html += `<div style="margin-top:4px;font-size:0.65rem;color:var(--label-3);">System learning: ${rec.learning_stats.total_moves_logged} moves logged, ${rec.learning_stats.overall_success_rate}% overall success</div>`;
            html += `<div style="margin-top:10px;"><button onclick="confirmMove('${employeeId}','${fromPath}','${toPath}',${goal})" style="background:var(--green);color:var(--label-1);border:none;padding:5px 14px;border-radius:4px;font-size:0.75rem;cursor:pointer;font-weight:500;">Confirm Move</button><span id="confirmMsg" style="margin-left:8px;font-size:0.7rem;color:var(--label-3);"></span></div>`;
            html += `</div>`;
            
            document.getElementById('recResult').innerHTML = html;
        } catch(e) {
            document.getElementById('recResult').innerHTML = '<p style="color:var(--red);">Error getting recommendation.</p>';
        }
    }
    
    function closeRec() { document.getElementById('recModal').style.display = 'none'; }

    async function confirmMove(employeeId, fromPath, toPath, goal) {
        try {
            const r = await fetch(`${API}/api/recommend-move`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({employee_id: employeeId, from_path: fromPath, to_path: toPath, goal_uph: goal, log_decision: true})
            });
            const res = await r.json();
            if (res.success) {
                document.getElementById('confirmMsg').textContent = 'Move logged! System will track outcome.';
                document.getElementById('confirmMsg').style.color = 'var(--green)';
            }
        } catch(e) {
            document.getElementById('confirmMsg').textContent = 'Error logging move.';
            document.getElementById('confirmMsg').style.color = 'var(--red)';
        }
    }

    // Auto-refresh
    function setupAutoRefresh(){if(refreshTimer)clearInterval(refreshTimer);if(countdownTimer)clearInterval(countdownTimer);if(refreshMin<=0){document.getElementById('countdown').textContent='(off)';return;}const ms=refreshMin*60000;nextRefresh=Date.now()+ms;refreshTimer=setInterval(async()=>{setStatus('fetching','Auto-refreshing...');if(await fetchData()){await fetchMoveLog();render();setStatus('ok','Refreshed '+time());}else setStatus('error','Failed');nextRefresh=Date.now()+ms;},ms);countdownTimer=setInterval(()=>{if(!nextRefresh)return;const rem=Math.max(0,nextRefresh-Date.now()),m=Math.floor(rem/60000),s=Math.floor((rem%60000)/1000);document.getElementById('countdown').textContent=`(${m}:${s.toString().padStart(2,'0')})`;},1000);}
    function resetCountdown(){if(refreshMin>0)nextRefresh=Date.now()+refreshMin*60000;}

    // Fast HC polling - updates active/inactive headcount every 30 seconds
    function startHCPoller(){
        setInterval(async()=>{
            try{
                const r=await fetch(API+'/api/data');
                if(r.ok){
                    const fresh=await r.json();
                    // Update all live fields
                    data.active_workforce=fresh.active_workforce||data.active_workforce;
                    data.workforce_by_path=fresh.workforce_by_path||data.workforce_by_path;
                    data.subpaths_by_path=fresh.subpaths_by_path||data.subpaths_by_path;
                    data.subpath_rates=fresh.subpath_rates||data.subpath_rates;
                    data.workforce_fc_mismatch=fresh.workforce_fc_mismatch;
                    data.pick_hc=fresh.pick_hc||data.pick_hc;
                    data.xtrain_status=fresh.xtrain_status;
                    data.xtrain_count=fresh.xtrain_count;
                    data.backfill_status=fresh.backfill_status;
                    data.backfill_progress=fresh.backfill_progress;
                    data.cross_training_by_employee_id=fresh.cross_training_by_employee_id||data.cross_training_by_employee_id;
                    data.history_summary=fresh.history_summary||data.history_summary;
                    data.eid_to_login=fresh.eid_to_login||data.eid_to_login;
                    await fetchMoveLog();
                    if(data.paths) render();
                }
            }catch(e){}
        },30000);
    }

    function setStatus(s,t){document.getElementById('statusDot').className='status-dot'+(s==='fetching'?' fetching':s==='error'?' error':s==='off'?' off':'');document.getElementById('statusText').textContent=t;}
    function showLoading(v){document.getElementById('loading').classList.toggle('hidden',!v);}

    // Dynamic tooltip positioning
    document.addEventListener('mouseover', function(e) {
        const tip = e.target.closest('.has-tip');
        if (tip) {
            const src = tip.querySelector('.tip-box');
            const gt = document.getElementById('globalTip');
            if (src && gt) {
                const rect = tip.getBoundingClientRect();
                // Copy the cell's tooltip content into the body-level tooltip
                gt.innerHTML = src.innerHTML;
                gt.style.display = 'block';
                const bw = gt.offsetWidth || 300;
                const bh = gt.offsetHeight || 160;
                const margin = 10;
                const vh = window.innerHeight;
                const vw = window.innerWidth;

                // Horizontal: prefer right of the cell, flip left if no room.
                let left = rect.right + 12;
                if (left + bw > vw - margin) left = rect.left - bw - 12;
                if (left < margin) left = margin;
                if (left + bw > vw - margin) left = Math.max(margin, vw - bw - margin);

                // Vertical: near the row, but lift up so the whole box stays
                // on-screen (never off the bottom).
                let top = rect.top;
                if (top + bh > vh - margin) top = vh - bh - margin;
                if (top < margin) top = margin;

                gt.style.left = left + 'px';
                gt.style.top = top + 'px';
            }
        }
    });
    document.addEventListener('mouseout', function(e) {
        const tip = e.target.closest('.has-tip');
        if (tip) {
            const gt = document.getElementById('globalTip');
            if (gt) gt.style.display = 'none';
        }
    });
    function fmt(d){return d.getFullYear()+'-'+(d.getMonth()+1+'').padStart(2,'0')+'-'+(d.getDate()+'').padStart(2,'0')+'T'+(d.getHours()+'').padStart(2,'0')+':'+(d.getMinutes()+'').padStart(2,'0');}
    function time(){return new Date().toLocaleTimeString();}

    document.addEventListener('DOMContentLoaded',async()=>{
        // Auto-detect shift based on current time or restore saved preference
        const savedShift = localStorage.getItem('staffing_shift');
        const hour = new Date().getHours();
        const autoShift = (hour >= 18 || hour < 5) ? 'night' : (hour >= 7 && hour < 18) ? 'day' : 'night';
        document.getElementById('shiftSelect').value = savedShift || autoShift;
        
        // Set time range to shift window and tell server
        const w = getShiftWindow();
        document.getElementById('startTime').value = fmt(w.start);
        document.getElementById('endTime').value = fmt(w.end);
        
        showLoading(true);
        try {
            // Tell server the shift and time range, then fetch
            await fetch(API+'/api/set-shift',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shift:savedShift||autoShift})}).catch(()=>{});
            await new Promise(r=>setTimeout(r,500));
            if(await fetchData()){await fetchMoveLog();render();setStatus('ok','Loaded '+time());if(data.refresh_interval_minutes){refreshMin=data.refresh_interval_minutes;document.getElementById('refreshInterval').value=refreshMin;}}
            else{setStatus('error','Failed to connect');document.getElementById('pathGrid').innerHTML='<div style="text-align:center;padding:60px;color:var(--label-3);grid-column:1/-1;"><h2 style="color:var(--label-2);">No Data</h2><p>Run: python staffing_dashboard_server.py</p></div>';}
        } catch(err) {
            console.error('Render error:', err);
            setStatus('error','JS Error: '+err.message);
            document.getElementById('pathGrid').innerHTML='<div style="text-align:center;padding:40px;color:var(--red);grid-column:1/-1;"><h2>Render Error</h2><p>'+err.message+'</p><p style="margin-top:8px;color:var(--label-2);">Check browser console (F12) for details</p></div>';
        }
        showLoading(false);setupAutoRefresh();startHCPoller();loadSites();
    });
    </script>
<div style="text-align:center;padding:12px;font-size:0.6rem;color:var(--label-3);border-top:1px solid var(--hairline);margin-top:20px;">PickMatrix <span id="footerVer" id="footerVer"></span> | Created &amp; managed by ttuyen | HOU8 Pick Operations | <span id="updateStatus">Checking for updates...</span></div>
<script>
// Check for updates on load.
// Uses raw.githubusercontent.com (CDN, no per-IP API rate limit) instead of
// api.github.com, which is capped at 60 req/hr/IP and shared by every user
// behind the FC's NAT. Versions are compared numerically, not as strings
// ("2.5.10" must beat "2.5.9").
function verTuple(v){return String(v||'').trim().split('.').map(x=>parseInt(x,10)||0);}
function verNewer(a,b){const x=verTuple(a),y=verTuple(b);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d!==0)return d>0;}return false;}
fetch('https://raw.githubusercontent.com/ttuyen099/pick-staffing-evaluator/main/version.txt?t='+Date.now(),{cache:'no-store'})
.then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(remoteRaw=>{
    const remote=remoteRaw.trim();
    fetch('/version.txt?t='+Date.now()).then(r=>r.text()).then(localVer=>{
        localVer=localVer.trim();
        const el=document.getElementById('updateStatus');
        if(verNewer(remote,localVer)) el.innerHTML='<span style="color:var(--orange);">Update v'+remote+' available </span><button onclick="runUpdate()" style="background:var(--orange);color:var(--label-1);border:none;padding:3px 10px;border-radius:4px;font-size:0.6rem;cursor:pointer;font-weight:600;">Update Now</button>';
        else el.innerHTML='<span style="color:var(--green);">&#10003; Up to date</span>';
    });
}).catch(()=>{document.getElementById('updateStatus').textContent='';});

fetch("/version.txt").then(r=>r.text()).then(v=>{var el=document.getElementById("footerVer");if(el)el.textContent="v"+v.trim();}).catch(()=>{});
function runUpdate(){
    document.getElementById('updateStatus').innerHTML='<span style="color:var(--yellow);">Downloading update...</span>';
    fetch(API+'/api/run-update',{method:'POST'}).then(r=>r.json()).then(d=>{
        if(d.success) document.getElementById('updateStatus').innerHTML='<span style="color:var(--green);">Updated! Close this terminal and reopen Start Dashboard.bat</span>';
        else document.getElementById('updateStatus').innerHTML='<span style="color:var(--red);">Update failed.</span>';
    }).catch(()=>{document.getElementById('updateStatus').innerHTML='<span style="color:var(--red);">Update failed.</span>';});
}
</script>
