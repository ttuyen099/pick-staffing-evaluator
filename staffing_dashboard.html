<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickMatrix</title>
    <!-- Typeface: SF Pro where the OS provides it (macOS/iOS, or a local install);
         otherwise Inter, the open-source SF-equivalent. display=swap renders text
         immediately in the fallback and swaps in Inter when it arrives, so an
         offline/blocked network never delays the page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        /* ==========================================================================
           PickMatrix 2.6.0 — Apple dark design system
           Tokens follow Apple HIG dark-mode semantics (system colors, label
           hierarchy, fills, separators) with a spacious, line-by-line reading
           rhythm. Dark only.
           ========================================================================== */
        :root {
            color-scheme: dark;

            /* Backgrounds (grouped, elevated) */
            --bg-base:        #000000;
            --bg-1:           #1c1c1e;   /* secondarySystemBackground */
            --bg-2:           #2c2c2e;   /* tertiarySystemBackground  */
            --bg-3:           #3a3a3c;

            /* Materials */
            --mat-bar:        rgba(28, 28, 30, 0.82);
            --mat-card:       rgba(28, 28, 30, 0.92);
            --mat-card-2:     rgba(44, 44, 46, 0.92);
            --mat-blur:       saturate(180%) blur(20px);

            /* Fills (quaternary -> primary, white alpha) */
            --fill-1:         rgba(120, 120, 128, 0.36);
            --fill-2:         rgba(120, 120, 128, 0.32);
            --fill-3:         rgba(118, 118, 128, 0.24);
            --fill-4:         rgba(116, 116, 128, 0.18);

            /* Labels */
            --label-1:        #ffffff;                    /* label            */
            --label-2:        rgba(235, 235, 245, 0.60);  /* secondaryLabel   */
            --label-3:        rgba(235, 235, 245, 0.30);  /* tertiaryLabel    */
            --label-4:        rgba(235, 235, 245, 0.18);  /* quaternaryLabel  */

            /* Separators */
            --sep:            rgba(84, 84, 88, 0.65);     /* separator        */
            --sep-opaque:     #38383a;
            --hairline:       rgba(255, 255, 255, 0.08);

            /* System colors (dark variants) */
            --blue:           #0a84ff;
            --green:          #30d158;
            --red:            #ff453a;
            --orange:         #ff9f0a;
            --yellow:         #ffd60a;
            --pink:           #ff375f;
            --purple:         #bf5af2;
            --teal:           #40c8e0;
            --indigo:         #5e5ce6;
            --mint:           #63e6e2;
            --gray:           #8e8e93;

            /* Tinted fills for status pills (system color @ ~16%) */
            --blue-tint:      rgba(10, 132, 255, 0.16);
            --green-tint:     rgba(48, 209, 88, 0.16);
            --red-tint:       rgba(255, 69, 58, 0.16);
            --orange-tint:    rgba(255, 159, 10, 0.16);
            --yellow-tint:    rgba(255, 214, 10, 0.16);

            /* Type ramp (SF Pro-ish). Base 15px for data density + legibility. */
            --fs-caption2:    0.6875rem;  /* 11px */
            --fs-caption1:    0.75rem;    /* 12px */
            --fs-footnote:    0.8125rem;  /* 13px */
            --fs-subhead:     0.9375rem;  /* 15px */
            --fs-body:        1.0625rem;  /* 17px */
            --fs-title3:      1.25rem;    /* 20px */
            --fs-title2:      1.375rem;   /* 22px */
            --fs-title1:      1.75rem;    /* 28px */
            --fs-large:       2.125rem;   /* 34px */

            /* Spacing rhythm */
            --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
            --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 40px;

            /* Radii */
            --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-pill: 999px;

            /* Motion */
            --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
            --dur:  180ms;

            /* Row rhythm for tables (spacious) */
            --row-pad-y: 13px;
            --row-pad-x: 14px;

            /* Sticky offsets */
            --bar-h: 60px;
            --tabs-top: 60px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            /* SF Pro (local/Apple) -> Inter (web, SF-equivalent) -> OS fallback.
               "SF Pro Text"/"SF Pro Display" match a user-installed SF Pro on
               Windows; -apple-system/BlinkMacSystemFont resolve to SF on Apple. */
            font-family: "SF Pro Text", "SF Pro Display", "SF Pro", -apple-system, BlinkMacSystemFont,
                         "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-base);
            color: var(--label-1);
            min-height: 100vh;
            font-size: var(--fs-subhead);
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            /* tnum: tabular numerals everywhere. cv05/cv08/cv11/ss01 are Inter's
               SF-style alternates (l with tail, open 4, single-storey a, etc.);
               they are ignored by fonts that lack them. */
            font-feature-settings: "tnum" 1, "cv05" 1, "cv08" 1, "cv11" 1, "ss01" 1;
        }
        ::selection { background: rgba(10,132,255,0.35); }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--fill-2); border-radius: var(--r-pill); border: 2px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-thumb:hover { background: var(--fill-1); background-clip: padding-box; border: 2px solid transparent; }
        ::-webkit-scrollbar-track { background: transparent; }

        h3 { font-weight: 600; letter-spacing: -0.01em; }
        b, strong { font-weight: 600; }
        button, input, select, textarea { font-family: inherit; font-feature-settings: inherit; }
        button { cursor: pointer; }
        a { color: var(--blue); text-decoration: none; }
        a:hover { text-decoration: underline; text-underline-offset: 2px; }

        /* Numeric data should always align */
        .num, td, .chip-val, .pm-val, .hc-num, .rate-pill, .sp-nums { font-variant-numeric: tabular-nums; }

        /* ---------- Semantic text colors (replace Tailwind utility classes) ---------- */
        .green  { color: var(--green); }
        .red    { color: var(--red); }
        .yellow { color: var(--yellow); }
        .orange { color: var(--orange); }
        .blue   { color: var(--blue); }
        .muted  { color: var(--label-2); }
        .faint  { color: var(--label-3); }

        /* ---------- Control bar (navigation material) ---------- */
        .control-bar {
            position: sticky; top: 0; z-index: 100;
            background: var(--mat-bar);
            -webkit-backdrop-filter: var(--mat-blur); backdrop-filter: var(--mat-blur);
            border-bottom: 1px solid var(--hairline);
            padding: var(--sp-3) var(--sp-6);
            min-height: var(--bar-h);
            display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
        }
        .logo { font-weight: 500; font-size: var(--fs-title3); color: var(--label-1); white-space: nowrap; letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: var(--sp-2); }
        .logo span:first-child { color: var(--blue); font-weight: 700; }
        #siteBadge { font-size: var(--fs-caption1) !important; font-weight: 600 !important; color: var(--blue) !important; background: var(--blue-tint) !important; border: 0 !important; border-radius: var(--r-pill) !important; padding: 3px 10px !important; letter-spacing: 0.02em; margin-left: 0 !important; vertical-align: middle; }
        #siteBadge:empty { display: none; }

        .control-group {
            display: flex; align-items: center; gap: var(--sp-2);
            padding: 6px 10px 6px 12px;
            background: var(--fill-4);
            border: 0; border-radius: var(--r-sm);
            transition: background var(--dur) var(--ease);
        }
        .control-group:focus-within { background: var(--fill-3); }
        .control-group label { font-size: var(--fs-caption1); font-weight: 500; color: var(--label-2); white-space: nowrap; letter-spacing: 0.01em; }
        .control-group input, .control-group select {
            background: transparent; border: 0; color: var(--label-1);
            padding: 2px 0; font-size: var(--fs-footnote); font-weight: 500;
            outline: none; min-height: 22px;
        }
        .control-group select { padding-right: 2px; }
        .control-group select option { background: var(--bg-2); color: var(--label-1); }
        .control-group input::-webkit-calendar-picker-indicator { filter: invert(1) opacity(0.6); cursor: pointer; }

        .btn {
            background: var(--blue); color: #fff; border: 0;
            padding: 7px 14px; border-radius: var(--r-sm);
            font-size: var(--fs-footnote); font-weight: 600; letter-spacing: -0.005em;
            white-space: nowrap; min-height: 32px;
            transition: background var(--dur) var(--ease), transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
        }
        .btn:hover { background: #2a93ff; }
        .btn:active { transform: scale(0.97); opacity: 0.9; }
        .btn.secondary { background: var(--fill-3); color: var(--label-1); }
        .btn.secondary:hover { background: var(--fill-2); }
        .btn.danger { background: var(--red-tint); color: var(--red); }
        .btn.danger:hover { background: rgba(255,69,58,0.26); }

        .status-area { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-caption1); color: var(--label-2); margin-left: auto; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(48,209,88,0.18); animation: pulse 2.4s var(--ease) infinite; }
        .status-dot.fetching { background: var(--yellow); box-shadow: 0 0 0 3px rgba(255,214,10,0.18); animation: none; }
        .status-dot.error { background: var(--red); box-shadow: 0 0 0 3px rgba(255,69,58,0.18); animation: none; }
        .status-dot.off { background: var(--gray); box-shadow: none; animation: none; }
        #countdown { font-size: var(--fs-caption2) !important; color: var(--label-3) !important; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }

        /* ---------- Legend strip ---------- */
        .legend-bar {
            display: flex; gap: var(--sp-4); padding: var(--sp-2) var(--sp-6);
            background: var(--bg-1);
            border-bottom: 1px solid var(--hairline);
            font-size: var(--fs-caption1); color: var(--label-2);
            flex-wrap: wrap; align-items: center;
        }
        .legend-bar .lg-title { font-weight: 600; color: var(--label-1); }
        .legend-bar .lg-title + .lg-item { margin-left: -4px; }
        .legend-bar .lg-gap { margin-left: var(--sp-4); }
        .lg-item { display: inline-flex; align-items: center; gap: 6px; }
        .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

        /* ---------- Main ---------- */
        .main { padding: var(--sp-5) var(--sp-6) var(--sp-8); }

        /* ---------- Summary chips (stat cards) ---------- */
        .summary { display: flex; gap: var(--sp-3); margin-bottom: var(--sp-5); flex-wrap: wrap; align-items: stretch; }
        .chip {
            background: var(--mat-card);
            -webkit-backdrop-filter: var(--mat-blur); backdrop-filter: var(--mat-blur);
            border: 1px solid var(--hairline);
            border-radius: var(--r-md);
            padding: var(--sp-3) var(--sp-4);
            min-width: 112px;
            display: flex; flex-direction: column; justify-content: center; gap: 2px;
        }
        .chip-val { font-size: var(--fs-title1); font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
        .chip-lbl { font-size: var(--fs-caption1); color: var(--label-2); font-weight: 500; letter-spacing: 0.01em; line-height: 1.3; }
        .chip-lbl .sub { display: block; font-size: var(--fs-caption2); color: var(--label-3); font-weight: 400; margin-top: 2px; }
        .chip.wide { flex: 1 1 100%; flex-direction: row; justify-content: flex-start; align-items: center; gap: var(--sp-5); padding: var(--sp-1) var(--sp-2); min-height: 0; background: transparent; border: 0; -webkit-backdrop-filter: none; backdrop-filter: none; font-size: var(--fs-caption1); color: var(--label-2); }
        .chip.wide .k { color: var(--label-3); margin-right: 4px; }

        /* ---------- Path grid & overview ---------- */
        .path-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--sp-4); align-items: start; }
        /* Single-view panels (Attrition, Idle, X-Train) live in the same grid; span it. */
        .path-grid > .panel { grid-column: 1 / -1; }
        .overview-cols { display: grid; grid-template-columns: minmax(460px, 1fr) 1.5fr; gap: var(--sp-5); align-items: start; }
        .overview-cols.single { display: block; }
        .overview-cols.single .overview-left { display: none; }
        .overview-left { position: sticky; top: calc(var(--bar-h) + 56px + var(--sp-3)); }
        .overview-right { min-width: 0; }
        #moveLogTableWrap thead th { position: sticky; top: 0; z-index: 2; }
        @media (max-width: 1100px) { .overview-cols { grid-template-columns: 1fr; } .overview-left { position: static; } }

        /* ---------- Segmented path tabs (pill bar) ---------- */
        .path-tabs {
            display: flex; gap: var(--sp-2); padding: var(--sp-3) var(--sp-6);
            background: var(--mat-bar);
            -webkit-backdrop-filter: var(--mat-blur); backdrop-filter: var(--mat-blur);
            border-bottom: 1px solid var(--hairline);
            flex-wrap: wrap; position: sticky; top: var(--tabs-top); z-index: 90;
            margin: 0 calc(-1 * var(--sp-6)) var(--sp-5);
        }
        .path-tab {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 14px; border-radius: var(--r-pill);
            font-size: var(--fs-footnote); font-weight: 500;
            cursor: pointer; border: 0;
            background: var(--fill-3); color: var(--label-1);
            transition: background var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease);
            white-space: nowrap; user-select: none;
        }
        .path-tab:hover { background: var(--fill-2); }
        .path-tab:active { transform: scale(0.97); }
        .path-tab.active { background: var(--label-1); color: #000; font-weight: 600; }
        .path-tab.active .tab-rate { color: rgba(0,0,0,0.55) !important; }
        /* Status dot instead of a colored left edge. hitting/missing = path rate;
           ok/alert/warn = semantic state for Idle (clear/flagged) and Attrition. */
        .path-tab.hitting::before, .path-tab.missing::before,
        .path-tab.ok::before, .path-tab.alert::before, .path-tab.warn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none; }
        .path-tab.hitting::before, .path-tab.ok::before { background: var(--green); }
        .path-tab.missing::before, .path-tab.alert::before { background: var(--red); }
        .path-tab.warn::before { background: var(--orange); }
        .path-tab.active::before { box-shadow: 0 0 0 2px rgba(0,0,0,0.15); }
        .path-tab .tab-rate { font-size: var(--fs-caption1); color: var(--label-2); font-weight: 500; font-variant-numeric: tabular-nums; }
        .path-tab.alert .tab-rate { color: var(--red); font-weight: 600; }
        .path-tab.warn .tab-rate { color: var(--orange); font-weight: 600; }
        .path-tab.ok .tab-rate { color: var(--green); }
        .path-tab.tab-xtrain { margin-left: auto; }

        /* ---------- Path card ---------- */
        .path-card {
            background: var(--mat-card);
            -webkit-backdrop-filter: var(--mat-blur); backdrop-filter: var(--mat-blur);
            border: 1px solid var(--hairline);
            border-radius: var(--r-lg);
            padding: var(--sp-4) var(--sp-5) var(--sp-4);
            position: relative; cursor: pointer; overflow: visible;
            transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
        }
        .path-card:hover { background: var(--mat-card-2); border-color: rgba(255,255,255,0.12); }

        .path-top { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-3); }
        .path-name { display: inline-flex; align-items: center; gap: 9px; font-weight: 600; font-size: var(--fs-body); color: var(--label-1); letter-spacing: -0.01em; min-width: 0; }
        .path-card.hitting .path-name::before, .path-card.missing .path-name::before { content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none; }
        .path-card.hitting .path-name::before { background: var(--green); box-shadow: 0 0 0 3px var(--green-tint); }
        .path-card.missing .path-name::before { background: var(--red); box-shadow: 0 0 0 3px var(--red-tint); }
        .path-badge { font-size: var(--fs-caption1); padding: 4px 10px; border-radius: var(--r-pill); font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .path-badge.hit { background: var(--green-tint); color: var(--green); }
        .path-badge.miss { background: var(--red-tint); color: var(--red); }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .path-metrics { display: flex; flex-wrap: wrap; gap: var(--sp-3) var(--sp-5); margin-bottom: var(--sp-4); align-items: flex-start; }
        .pm { text-align: left; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
        .pm-val { font-size: var(--fs-title2); font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
        .pm-lbl { font-size: var(--fs-caption1); color: var(--label-2); font-weight: 500; white-space: nowrap; }
        .goal-input {
            width: 56px !important; background: var(--fill-4) !important; border: 0 !important;
            color: var(--label-1) !important; text-align: center;
            border-radius: var(--r-sm) !important; font-size: var(--fs-title2) !important; font-weight: 600 !important;
            padding: 2px 4px !important; letter-spacing: -0.02em; outline: none;
            transition: background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
        }
        .goal-input:hover { background: var(--fill-3) !important; }
        .goal-input:focus { background: var(--fill-3) !important; box-shadow: 0 0 0 3px rgba(10,132,255,0.35); }

        /* HC breakdown */
        .pm-hc { display: flex; gap: var(--sp-2); align-items: baseline; }
        .pm-hc .hc-part { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; gap: 3px; }
        .pm-hc .hc-num { font-size: var(--fs-title2); font-weight: 600; letter-spacing: -0.02em; }
        .pm-hc .hc-num.total { color: var(--label-1); }
        .pm-hc .hc-num.active { color: var(--green); }
        .pm-hc .hc-num.inactive { color: var(--label-3); }
        .pm-hc .hc-sub { font-size: var(--fs-caption2); color: var(--label-3); font-weight: 500; white-space: nowrap; }
        .pm-hc .hc-sep { color: var(--label-4); font-size: var(--fs-title3); font-weight: 300; align-self: flex-start; line-height: 1; }
        .pm-subpaths { display: flex; gap: var(--sp-2); margin-top: var(--sp-1); flex-wrap: wrap; }
        .pm-subpaths .sp { font-size: var(--fs-caption2); color: var(--label-2); white-space: nowrap; }
        .pm-subpaths .sp b { color: var(--label-1); font-size: var(--fs-caption1); }
        .pm-hc-wrap { display: flex; flex-direction: column; align-items: flex-start; }
        .pm-hc-split { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
        .pm-hc-split .sp-row { display: flex; align-items: baseline; gap: var(--sp-2); white-space: nowrap; }
        .pm-hc-split .sp-name { font-size: var(--fs-caption1); font-weight: 600; color: var(--label-2); min-width: 52px; }
        .pm-hc-split .sp-nums { font-size: var(--fs-subhead); font-weight: 600; letter-spacing: 0.01em; color: var(--label-3); }
        .pm-hc-split .sp-nums b { font-weight: 600; }
        .pm-hc-split .sp-nums .total { color: var(--label-1); }
        .pm-hc-split .sp-nums .active { color: var(--green); }
        .pm-hc-split .sp-nums .inactive { color: var(--label-3); }
        .pm-hc-split .sp-rate { font-size: var(--fs-caption1); font-weight: 600; color: var(--label-1); }
        .pm-hc-split .sp-rate::after { content: ' UPH'; color: var(--label-3); font-size: var(--fs-caption2); font-weight: 500; }
        .pm-hc-split .sp-legend { font-size: var(--fs-caption2); color: var(--label-4); margin-top: 2px; }

        /* Progress */
        .progress-wrap { margin-bottom: var(--sp-3); }
        .progress-bar { height: 6px; background: var(--fill-4); border-radius: var(--r-pill); position: relative; overflow: visible; }
        .progress-fill { height: 100%; border-radius: var(--r-pill); transition: width 400ms var(--ease); }
        .progress-fill.hit { background: var(--green); }
        .progress-fill.miss { background: var(--red); }
        .progress-marker { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--label-1); border-radius: 1px; opacity: 0.85; }

        .path-footer { display: flex; justify-content: space-between; gap: var(--sp-3); font-size: var(--fs-footnote); color: var(--label-2); }
        .path-footer .val { color: var(--label-1); font-weight: 600; font-variant-numeric: tabular-nums; }
        .path-footer .val.pos { color: var(--green); }
        .path-footer .val.neg { color: var(--red); }

        .path-expand { display: none; margin-top: var(--sp-4); border-top: 1px solid var(--hairline); padding-top: var(--sp-3); overflow: visible; }
        .path-expand.open { display: block; }

        /* ---------- Tables (spacious, inset-grouped style) ---------- */
        .assoc-table, .movelog-table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            font-size: var(--fs-subhead); table-layout: auto;
        }
        .movelog-table { table-layout: fixed; }
        .assoc-table th, .movelog-table th {
            padding: 10px var(--row-pad-x);
            text-align: left;
            font-size: var(--fs-caption1); font-weight: 600; letter-spacing: 0.02em;
            color: var(--label-3);
            border-bottom: 1px solid var(--sep);
            background: transparent;
            white-space: nowrap;
            text-transform: none;
        }
        .assoc-table th:first-child, .movelog-table th:first-child { border-top-left-radius: var(--r-sm); }
        .assoc-table th:last-child, .movelog-table th:last-child { border-top-right-radius: var(--r-sm); }
        .assoc-table th:nth-child(3),

<body>
    <div class="control-bar">
        <div class="logo">Pick<span>Matrix</span><span id="siteBadge"></span></div>
        <div class="control-group">
            <label>Site</label>
            <select id="siteSelect" onchange="changeSite()"></select>
        </div>
        <div class="control-group">
            <label>Shift</label>
            <select id="shiftSelect" onchange="changeShift()">
                <option value="night">Night (6:30PM - 5:00AM)</option>
                <option value="day">Day (7:30AM - 6:00PM)</option>
            </select>
        </div>
        <div class="control-group"><label>Start</label><input type="datetime-local" id="startTime" step="900"></div>
        <div class="control-group"><label>End</label><input type="datetime-local" id="endTime" step="900"></div>
        <button class="btn" onclick="applyTimeRange()">Apply</button>
        <button class="btn secondary" onclick="resetToShift()">Reset</button>
        <div class="control-group">
            <label>Auto-Refresh</label>
            <select id="refreshInterval" onchange="changeInterval()">
                <option value="15">15 min</option>
                <option value="30">30 min</option>
                <option value="5">5 min</option>
                <option value="0">Off</option>
            </select>
        </div>
        <button class="btn secondary" onclick="manualRefresh()">Refresh Now</button>
        <div class="status-area">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Loading...</span>
            <span id="countdown"></span>
        </div>
    </div>

    <div class="legend-bar">
        <span class="lg-title">Cross-training</span>
        <span class="lg-item"><span class="dot pick"></span>Pick</span>
        <span class="lg-item"><span class="dot stow"></span>Stow</span>
        <span class="lg-item"><span class="dot receive"></span>Receive</span>
        <span class="lg-item"><span class="dot pack"></span>Pack</span>
        <span class="lg-item"><span class="dot ship-dock"></span>Ship Dock</span>
        <span class="lg-item"><span class="dot ib-dock"></span>IB Dock</span>
        <span class="lg-item"><span class="dot icqa"></span>ICQA</span>
        <span class="lg-item"><span class="dot vrets"></span>VRets</span>
        <span class="lg-title lg-gap">Rate</span>
        <span class="lg-item"><span class="dot above"></span>Above</span>
        <span class="lg-item"><span class="dot at"></span>At</span>
        <span class="lg-item"><span class="dot below"></span>Below</span>
    </div>

    <div class="main">
        <div class="summary" id="summary"></div>
        <div class="path-tabs" id="pathTabs"></div>
        <div class="overview-cols" id="overviewCols">
            <div class="overview-left" id="moveLogSection"></div>
            <div class="overview-right"><div class="path-grid" id="pathGrid"></div></div>
        </div>
    </div>

    <div class="loading" id="loading"><div class="spinner"></div><span>Loading PickMatrix&hellip;</span></div>

    <!-- Single body-level tooltip (rendered outside any backdrop-filtered card
         so position:fixed is truly viewport-relative and never clipped). -->
    <div id="globalTip"></div>

    <!-- Recommendation Modal -->
    <div id="recModal" class="modal-backdrop" style="display:none;" onclick="closeRec()">
        <div class="modal-sheet" onclick="event.stopPropagation()">
            <div class="modal-head">
                <h3 id="recTitle">Move Recommendation</h3>
                <button class="modal-close" onclick="closeRec()" aria-label="Close">&#10005;</button>
            </div>
            <div id="recContent" class="modal-body"></div>
        </div>
    </div>

    <script>
    let data = null, refreshTimer = null, countdownTimer = null, nextRefresh = null, refreshMin = 15;
    let openPaths = new Set(), ctOpen = false, ctDept = 'All', selectedPath = null;
    let moveLog = [], moveLogFilter = '', moveLogScroll = 0, moveLogRange = 'shift';
    // Custom rate goals are stored per-site so goals don't bleed across FCs.
    // The key is finalized once we know the active site (from data.warehouse_id);
    // until then we use the legacy global key for backward compatibility.
    let _goalSite = '';
    function goalKey() { return _goalSite ? ('staffing_goals_' + _goalSite) : 'staffing_goals'; }
    let customGoals = JSON.parse(localStorage.getItem('staffing_goals') || '{}');
    function loadGoalsForSite(site) {
        const s = (site || '').toUpperCase();
        if (s === _goalSite) return;
        _goalSite = s;
        let stored = localStorage.getItem(goalKey());
        // One-time migration: seed a new site's goals from the legacy global key.
        if (stored === null && s) {
            const legacy = localStorage.getItem('staffing_goals');
            if (legacy !== null) stored = legacy;
        }
        customGoals = JSON.parse(stored || '{}');
    }
    const API = window.location.origin;
    const DC = {'Pick':'pick','Stow':'stow','Receive':'receive','Pack':'pack','Ship Dock':'ship-dock','IB Dock':'ib-dock','ICQA':'icqa','VRets':'vrets'};

    function getGoal(pathName, serverExp) {
        return customGoals[pathName] !== undefined ? customGoals[pathName] : serverExp;
    }

    function updateGoal(input) {
        const pathName = input.dataset.path;
        const val = parseFloat(input.value) || 0;
        customGoals[pathName] = val;
        localStorage.setItem(goalKey(), JSON.stringify(customGoals));
        render();
    }

    function pf(rate, exp, tol) { if (rate >= exp) return 'above'; if (rate >= exp*(1-(tol||0.05))) return 'at'; return 'below'; }

    async function fetchData(retries=10) { for(let i=0;i<retries;i++){ try { const r=await fetch(API+'/api/data'); if(r.ok){data=await r.json();return true;} if(r.status===503){setStatus('fetching','Server fetching FCLM data... (attempt '+(i+1)+')');} } catch(e){setStatus('fetching','Connecting to server...');} if(i<retries-1) await new Promise(r=>setTimeout(r,2000)); } return false; }

    async function applyTimeRange() {
        const s=document.getElementById('startTime').value, e=document.getElementById('endTime').value;
        if(!s||!e)return; showLoading(true); setStatus('fetching','Fetching...');
        try {
            const r=await fetch(API+'/api/set-time-range',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start_time:s,end_time:e})});
            const res=await r.json();
            if(res.success&&res.data){data=res.data;await fetchMoveLog();render();setStatus('ok','Updated '+time());}
            else if(res.success){await fetchMoveLog();render();setStatus('ok','No data for this time range');} 
            else{setStatus('error','Fetch failed');}
        } catch(e){setStatus('error','Connection error');}
        showLoading(false);
    }

    async function manualRefresh() {
        showLoading(true); setStatus('fetching','Refreshing...');

    function getShiftWindow() {
        const shift = document.getElementById('shiftSelect').value;
        const now = new Date();
        let start = new Date(now), end = new Date(now);
        
        if (shift === 'night') {
            // Night: 6:30PM - 5:00AM
            if (now.getHours() < 5 || (now.getHours() === 5 && now.getMinutes() === 0)) {
                // We're in the AM portion (after midnight)
                start.setDate(start.getDate() - 1);
                start.setHours(18, 30, 0, 0);
                end.setHours(5, 0, 0, 0);
            } else if (now.getHours() >= 18 && now.getMinutes() >= 30) {
                // We're after 6:30PM (shift has started)
                start.setHours(18, 30, 0, 0);
                end.setDate(end.getDate() + 1);
                end.setHours(5, 0, 0, 0);
            } else if (now.getHours() >= 18) {
                // Between 6:00PM and 6:30PM (shift hasn't started yet)
                start.setHours(18, 30, 0, 0);
                end.setDate(end.getDate() + 1);
                end.setHours(5, 0, 0, 0);
            } else {
                // During the day but night shift selected - use tonight's shift
                start.setHours(18, 30, 0, 0);
                end.setDate(end.getDate() + 1);
                end.setHours(5, 0, 0, 0);
            }
        } else {
            // Day: 7:30AM - 6:00PM
            start.setHours(7, 30, 0, 0);
            end.setHours(18, 0, 0, 0);
        }
        
        return { start, end };
    }

    function changeShift() {
        const shift = document.getElementById('shiftSelect').value;
        localStorage.setItem('staffing_shift', shift);
        // Also tell server to filter cross-training by this shift
        fetch(API + '/api/set-shift', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({shift:shift})}).catch(()=>{});
        const w = getShiftWindow();
        document.getElementById('startTime').value = fmt(w.start);
        document.getElementById('endTime').value = fmt(w.end);
        applyTimeRange();
    }

    async function loadSites() {
        try {
            const r = await fetch(API + '/api/sites');
            if (!r.ok) return;
            const info = await r.json();
            const sel = document.getElementById('siteSelect');
            if (!sel || !info.sites) return;
            sel.innerHTML = info.sites.map(s => `<option value="${s}"${s===info.active?' selected':''}>${s}</option>`).join('');
            // If only one site is configured, keep the selector but it's a no-op.
        } catch(e) { /* selector stays empty; not fatal */ }
    }

    async function changeSite() {
        const sel = document.getElementById('siteSelect');
        const site = sel.value;
        if (!site) return;
        // Confirm — switching restarts the server and reloads the page.
        setStatus('loading', 'Switching to ' + site + '…');
        const loadingSpan = document.querySelector('#loading span');
        if (loadingSpan) loadingSpan.textContent = 'Switching site to ' + site + ' — restarting…';
        showLoading(true);
        try {
            const r = await fetch(API + '/api/set-site', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ site })
            });
            const res = await r.json();
            if (!res.success) { setStatus('error', res.error || 'Switch failed'); showLoading(false); await loadSites(); return; }
            // Server is restarting. Poll /api/status until it's back, then reload.
            waitForServerThenReload(site);
        } catch(e) {
            // The restart can drop the in-flight connection; treat as "restarting".
            waitForServerThenReload(site);
        }
    }

    function waitForServerThenReload(site) {
        let tries = 0;
        const iv = setInterval(async () => {
            tries++;
            try {
                const r = await fetch(API + '/api/status', {cache:'no-store'});
                if (r.ok) { clearInterval(iv); location.reload(); return; }
            } catch(e) { /* still down */ }
            if (tries > 30) { clearInterval(iv); setStatus('error','Server did not come back — restart Start Dashboard.bat'); showLoading(false); }
        }, 1000);
    }
