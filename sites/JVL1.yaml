# ============================================================
# PickMatrix Site Config — JVL1
# ============================================================
# Selected via site.txt, --site=JVL1, or PICKMATRIX_SITE=JVL1.
# Overrides the base config.yaml / staffing_config.yaml for this site.
#
# Path NAMES and FCLM function IDs are auto-discovered at runtime from JVL1's
# FCLM functionRollup response, so you do NOT need to hand-enter function IDs.

# ---- Auth / warehouse ----
warehouse_id: "JVL1"
# Standard Pick functionRollup process id. If JVL1 uses a different process id,
# update this value (check the FCLM functionRollup URL for JVL1).
process_id: "1003001"

# ---- Rate goals (UPH) — starting values; tune on the dashboard per path ----
rate_expectations:
  "RF Pick Singles": 50
  "OrderPickLowDensityP": 20
  "OrderPickVNA": 35
  "Orderpicker Pick": 30
  "OrderPick SIOC": 20
  "MultiRelayPick": 20
  "RF Pick": 5
  "Giftwrap Picking": 5

default_rate_expectation: 5

# ---- Dashboard ----
dashboard:
  refresh_interval_minutes: 15
  port: 8787

# ---- Shift window ----
staffing_evaluator:
  shift_start_hour: 18
  shift_start_minute: 0
  tolerance: 0.05
