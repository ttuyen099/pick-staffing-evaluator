# ============================================================
# FCLM Rate Puller - Configuration (template)
# ============================================================
# For multi-site, prefer the in-dashboard Site dropdown, Start Dashboard.bat <SITE>,
# a site.txt file, or PICKMATRIX_SITE. Those override warehouse_id below.
warehouse_id: "HOU8"
process_id: "1003001"

primary_attribute: "PICK_PATH_TYPE"
secondary_attribute: "PICKING_PROCESS_PATH"
node_type: "FC"

schedule_offset_minutes: 10

# Slack webhook: OPTIONAL. Leave blank. Create your OWN webhook if needed.
# Never commit a real webhook URL.
slack_webhook_url: ""

cookie_settings:
  method: "firefox_auto"
  domain: "amazon.com"

end_of_shift:
  enabled: false
  trigger_hour: 4
  trigger_minute: 55
  process_id: "1003001"
  shift_start_hour: 18
  shift_start_minute: 0
  shift_end_hour: 6
  shift_end_minute: 0